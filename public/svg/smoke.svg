<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- one wisp of smoke: fractal noise → alpha, softened by a radial fade. Rendered once as an image;
       the page only moves it, so it costs nothing per frame. -->
  <defs>
    <filter id="s" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.016" numOctaves="4" seed="7" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.02  0 0 0 0 0.03  0 0 0 2.4 -1.05" />
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <radialGradient id="f" cx="50%" cy="50%" r="50%">
      <stop offset="0.35" stop-color="#fff" /><stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <mask id="m"><rect width="600" height="400" fill="url(#f)" /></mask>
  </defs>
  <rect width="600" height="400" filter="url(#s)" mask="url(#m)" />
</svg>
